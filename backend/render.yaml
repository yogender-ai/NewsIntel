services:
  - type: web
    name: newsintel-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GATEWAY_SECRET
        sync: false
      - key: GATEWAY_BASE_URL
        sync: false
      - key: INGEST_SECRET
        sync: false
      - key: ENV
        value: production
  - type: worker
    name: newsintel-worker
    runtime: docker
    dockerfilePath: ./Dockerfile.worker
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GATEWAY_SECRET
        sync: false
      - key: GATEWAY_BASE_URL
        sync: false
      - key: INGEST_SECRET
        sync: false
      - key: ENV
        value: production
